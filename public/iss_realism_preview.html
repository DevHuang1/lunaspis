<!doctype html>
<html><head><meta charset="utf-8"><title>ISS test scene</title>
<style>body{margin:0}canvas{display:block}#status{position:fixed;top:0;left:0;background:#111;color:white;font:14px monospace;z-index:9999}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/loaders/DRACOLoader.js"></script><script src="js/loaders/KTX2Loader.js"></script><script src="js/loaders/meshopt_decoder.js"></script><script src="js/loaders/GLTFLoader.js"></script><script src="js/loaders/SkeletonUtils.js"></script>
<script src="js/core/glb_manager.js"></script><script src="js/world/ship_interior.js"></script></head><body><div id="status">Loading</div><script>
const params=new URLSearchParams(location.search),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.05,200);
window.renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);
window.isGameStarted=true;window.shipInterior.init(scene);window.shipInterior.show();const rig=window.glbManager.createAstronautRig('#67e8f9','commander','TEST',true,'astronaut_lod0');rig.root.position.set(Number(params.get('x')||0),0,Number(params.get('z')||2));scene.add(rig.root);window.localCrew={group:rig.root,rig};
let keys={},yaw=Number(params.get('yaw')||Math.PI),pitch=0,third=false,frameCount=0,interval=0;document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='c')third=!third;if(e.key==='q')yaw-=.25;if(e.key==='e')yaw+=.25;if(e.key==='ArrowUp')pitch=Math.min(.8,pitch+.12);if(e.key==='ArrowDown')pitch=Math.max(-.8,pitch-.12)});document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;let dx=((keys.d?1:0)-(keys.a?1:0))*1.8*dt,dz=((keys.s?1:0)-(keys.w?1:0))*1.8*dt;const prev=rig.root.position.clone(),next=prev.clone().add(new THREE.Vector3(dx,0,dz));rig.root.position.copy(window.shipInterior.resolveCollision(prev,next,.32));rig.updateAnimation(dt,prev.distanceTo(rig.root.position)>.0001,false,true);rig.root.visible=third;let head=rig.root.position.clone().add(new THREE.Vector3(0,1.6,0));if(third){const target=head.clone().add(new THREE.Vector3(-Math.sin(yaw)*2.5,.2,-Math.cos(yaw)*2.5));camera.position.lerpVectors(head,target,window.shipInterior.cameraClearFraction(head,target));}else camera.position.copy(head);camera.lookAt(head.x+Math.sin(yaw)*10,head.y+Math.tan(pitch)*10,head.z+Math.cos(yaw)*10);window.shipInterior.update(dt,now/1000,camera);renderer.render(scene,camera);frameCount++;interval+=dt;if(interval>.4){document.querySelector('#status').textContent=`x=${rig.root.position.x.toFixed(2)} z=${rig.root.position.z.toFixed(2)} ${third?'THIRD':'FIRST'} ${rig.activeClipName} FPS=${Math.round(frameCount/interval)} DRAWS=${renderer.info.render.calls}`;frameCount=0;interval=0}}requestAnimationFrame(frame);
</script></body></html>
