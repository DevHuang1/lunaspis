name: GMAT base image

# Builds the Ubuntu + GMAT runtime once and publishes it to GHCR. The app
# Dockerfile pulls this immutable base, so routine deploys skip the ~383 MB
# SourceForge download and finish in minutes instead of ~15 minutes.
on:
  push:
    branches: [main]
    paths:
      - docker/gmat-base.Dockerfile
      - .github/workflows/gmat-base-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gmat-base-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GMAT base image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/gmat-base.Dockerfile
          push: true
          tags: |
            ghcr.io/devhuang1/lunaspis-gmat:r2026a
            ghcr.io/devhuang1/lunaspis-gmat:r2026a-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
